
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Certifications{% endblock %}</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #F7F4EC;
            margin: 0;
            color: #29483C;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 30px 35px;
        }

        /* Header */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            background: #29483C;
            color: #F7F4EC;
            padding: 25px 35px;
            border-radius: 8px;
            flex-wrap: wrap;
        }

        .header h1 {
            margin: 0;
            color: #F7F4EC;
            font-size: 26px;
        }

        .header p {
            margin: 5px 0 0;
            color: #F7F4EC;
        }

        /* Back Button */

        .back-link {
            display: inline-block;
            background: #527B63;
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 11px 20px;
            border-radius: 6px;
            font-size: 14px;
            white-space: nowrap;
        }

        .back-link:hover {
            background: #6B9279;
        }

        /* General Buttons */

        .btn {
            display: inline-block;
            background: #527B63;
            color: white;
            border: 0;
            padding: 11px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .btn:hover {
            background: #6B9279;
        }

        .btn.secondary {
            background: white;
            color: #29483C;
            border: 1px solid #29483C;
        }

        .btn.danger {
            background: #b42318;
        }

        /* Messages */

        .messages {
            list-style: none;
            padding: 0;
            margin: 0 0 15px;
        }

        .messages li {
            background: #e7f4ec;
            border: 1px solid #267347;
            color: #1d5a37;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .messages li.error {
            background: #fdecea;
            border-color: #b42318;
            color: #b42318;
        }

        /* Expiration Warning */

        .banner {
            background: #fff4cc;
            border: 1px solid #b58900;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-weight: bold;
        }

        /* Summary Cards */

        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .summary-card {
            background: white;
            padding: 16px 20px;
            border-radius: 10px;
            border: 1px solid #DDD5C5;
        }

        .summary-card h3 {
            font-size: 14px;
            color: #666;
            margin: 0;
        }

        .summary-card p {
            font-size: 28px;
            font-weight: bold;
            margin: 6px 0 0;
            color: #29483C;
        }

        /* Main Panel */

        .panel {
            background: white;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #DDD5C5;
        }

        /* Filters */

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }

        .filters input,
        .filters select {
            padding: 9px 10px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 14px;
            background: white;
        }

        .filters input[type=search] {
            min-width: 260px;
        }

        /* Table */

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            white-space: nowrap;
        }

        th {
            background: #29483C;
            color: white;
        }

        /* Certification Status Labels */

        .pill {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid;
        }

        .pill.active {
            background: #e6f4e6;
            color: #1d5a37;
            border-color: #2b7a2b;
        }

        .pill.soon {
            background: #fff4cc;
            color: #7a5a00;
            border-color: #b58900;
        }

        .pill.expired {
            background: #fdecea;
            color: #b42318;
            border-color: #b42318;
            border-style: dashed;
        }

        /* Actions */

        .actions a {
            color: #29483C;
            font-weight: bold;
            text-decoration: none;
        }

        .actions a.delete {
            color: #b42318;
        }

        /* Empty Results */

        .empty {
            padding: 30px;
            text-align: center;
            color: #666;
        }

        /* Pagination */

        .pager {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            color: #555;
            flex-wrap: wrap;
            gap: 10px;
        }

        .pager a {
            color: #29483C;
            font-weight: bold;
            text-decoration: none;
            margin: 0 6px;
        }

        /* Forms */

        .form-row {
            margin-bottom: 18px;
        }

        .form-row label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .form-row input,
        .form-row select {
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 15px;
            min-width: 280px;
        }

        .help {
            color: #666;
            font-size: 13px;
            margin-top: 4px;
        }

        .errorlist {
            list-style: none;
            padding: 0;
            margin: 4px 0 0;
            color: #b42318;
            font-weight: bold;
            font-size: 14px;
        }

        /* Responsive Layout */

        @media (max-width: 800px) {

            .summary {
                grid-template-columns: repeat(2, 1fr);
            }

            .container {
                padding: 20px;
            }

            .header {
                padding: 25px;
            }

        }

        @media (max-width: 500px) {

            .summary {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

        }

    </style>
</head>

<body>

<div class="container">

    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}

    {% block content %}{% endblock %}

</div>

</body>
</html>
